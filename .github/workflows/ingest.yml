name: Ingest LAMP data

on:
  schedule:
    # Runs once a day. LAMP publishes each service_date's file with roughly a
    # 1-day lag, so this doesn't need to be more frequent than daily.
    - cron: '17 9 * * *'  # 09:17 UTC = ~04:17-05:17 America/New_York depending on DST
  workflow_dispatch: {}  # allow manual runs from the Actions tab

permissions:
  contents: write  # needed to commit new/updated data files back to the repo
  actions: write   # needed to trigger deploy.yml (see the last step below)

concurrency:
  group: ingest
  cancel-in-progress: false  # never cancel a partial ingest run; let it finish and checkpoint

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run ingestion (reconciliation mode — picks up whatever's new/stale)
        run: python backend/lamp_ingest.py --start-date 2023-01-01

      - name: Refresh service alerts
        run: python backend/alerts_ingest.py

      - name: Commit and push any new data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/daily backend/data/manifest.csv backend/data/alerts.parquet
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Ingest LAMP data $(date -u +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN (as above) does NOT fire other
      # workflows' `on: push` trigger -- GitHub blocks that specifically to prevent
      # workflows chain-triggering each other in a loop. deploy.yml only listens for
      # push, so without this, a successful ingest silently never rebuilds the site.
      # Explicitly invoking it via the API is a different, allowed path.
      - name: Trigger site rebuild
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }}
